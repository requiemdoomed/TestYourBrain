# Runs the tests on every push and pull request.
name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests (engine, checked against the Python version)
        run: npm test
      - name: Check the compiled stylesheet is up to date
        run: npm run css && git diff --exit-code assets/app.css
      - name: Install a browser for the end-to-end test
        run: npx playwright install --with-deps chromium
      - name: End-to-end test in a real browser
        run: SCREENSHOTS=screenshots npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots
